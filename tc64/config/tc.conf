# TC64 工具链配置
#
# 状态：**说明性质**。当前版本的 tc.exe 不读取本文件 —— 下面都是将来会接的
#       默认项，写在这里是为了让约定先固定下来，避免以后改动解析规则时
#       与既有工程冲突。
#
# 格式：key = value，一行一项，# 开头为注释。

# 默认子系统：console（弹控制台） / gui（无控制台窗口）
# 对应命令行 -console / -gui；命令行优先。
subsystem = console

# 默认输出文件名（与 gcc 一致）
output = a.exe

# 是否默认启用编译缓存（对应 -cache）
cache = off

# 缓存目录（相对工具链根）
cache_dir = share\cache

# 额外 import 搜索根，分号分隔；相对路径按工具链根解析
# 注意：<root>\include、<root>\lib 等默认根由编译器自动加入，无需在此重复。
include_paths =

# 诊断细节：on 时连"已尝试过哪些目录"一起打印
diagnostics_verbose = on
